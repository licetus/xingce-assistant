name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# 取消正在进行中的旧 run，避免重复跑
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 主 job：跑 npm test（覆盖 Node 18/20/22 三个版本）
  # ---------------------------------------------------------------------------
  test:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # 一个 Node 版本挂了不影响其他
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # 项目零运行时依赖，无 package-lock.json。不开 npm cache（开了反而要求 lockfile）。

      # 项目零运行时依赖，npm install 只是为了触发 cache 预热（不装任何东西）
      - name: Install (no-op, zero deps)
        run: npm install --no-audit --no-fund --silent || true

      - name: Run tests (all)
        run: npm test

      # 单独跑 3 类，确认细分失败时定位更精准
      - name: Run unit tests
        if: matrix.node == 22  # 只在最新版上跑细分，省 CI 时间
        run: npm run test:unit

      - name: Run integration tests
        if: matrix.node == 22
        run: npm run test:integration

      - name: Run static checks
        if: matrix.node == 22
        run: npm run test:static

  # ---------------------------------------------------------------------------
  # 可选 job：云开发健康检查（仅 develop 分支 push 触发）
  # 需要 GitHub repo 配 2 个 secret：
  #   TENCENTCLOUD_SECRETID / TENCENTCLOUD_SECRETKEY
  # 没配也能跑——会跳过（continue-on-error: true）
  # ---------------------------------------------------------------------------
  cloudbase-healthcheck:
    name: 云开发健康检查
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # 项目零运行时依赖，无 package-lock.json。不开 npm cache。


      - name: Install @cloudbase/node-sdk (临时)
        run: npm install @cloudbase/node-sdk --no-save --no-audit --no-fund --silent

      - name: Run timer.healthCheck
        env:
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
          CLOUD_ENV_ID: pro-d3g3e4uab0265b1c6
        run: node scripts/cloudbase-healthcheck.js